# Webhook Notifications Budget Configuration
# Use case: Send alerts to Slack or an HTTPS webhook when thresholds are breached
# Related docs: docs/guides/budgets.md#budget-notifications
# Tested with: FinFocus v0.4.4+

# yaml-language-server: $schema=https://finfocus.dev/schemas/config.json

cost:
  budgets:
    global:
      amount: 1000.00
      currency: USD

      alerts:
        - threshold: 80
          type: forecasted
          # Send to the Slack warning channel
          notifications:
            - type: slack
              url: "${FINFOCUS_NOTIFY_SLACK_URL}"
              channel: "#finops-warning"

        - threshold: 100
          type: actual
          # Send a JSON event to an HTTPS webhook
          notifications:
            - type: webhook
              url: "https://events.example.com/budget-alert"
              headers:
                Authorization: "Bearer ${FINFOCUS_NOTIFY_API_TOKEN}"

# Usage:
#   finfocus cost actual --notify
