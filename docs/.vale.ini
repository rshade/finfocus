# Vale prose quality configuration
# Vale checks for clarity, consistency, and tone.
#
# Run `make docs-vale` locally. CI runs the same config on pull requests
# through vale-action and reviewdog (.github/workflows/docs-validate.yml) and
# reports only the lines a pull request adds.

# `vale sync` downloads the packages into StylesPath. They are git-ignored;
# only config/vocabularies/FinFocus/accept.txt is tracked.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = FinFocus
Packages = Google, Microsoft, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

IgnoredScopes = code, pre

# Don't check these HTML/code elements
IgnoredClasses = pre, code, span

[*.{md,mdx}]
# Use Google and Microsoft styles as baseline, plus Vale's built-in spelling
# and term checks. ai-tells flags prose patterns common in LLM output; its
# rules are suggestions below, so they never fail CI.
BasedOnStyles = Vale, Google, Microsoft, ai-tells

Google.Acronyms = YES
Google.Contractions = YES
Google.Exclamation = NO
Google.Headings = YES
Google.Passive = NO
Google.Quotes = warning
Google.Ranges = YES
Google.Sentence = YES
Google.Spelling = YES

Microsoft.Contractions = NO
Microsoft.Exclamation = NO
Microsoft.HeadingAcronyms = YES
Microsoft.Headings = YES
Microsoft.Quotes = warning
Microsoft.Ranges = YES
Microsoft.Spaces = YES

# Rules that ship at error but fire on correct text in these docs are lowered
# to warning, so they still comment on a pull request but do not fail it.
# Raise one back to error only once it has no false positives here.
#
# Code literals in prose: quoted list values ("aws", above), Go durations
# (100ms), identifiers (filepath.Match), and flag values (-1).
Google.Units = warning
Google.Spacing = warning
Microsoft.Spacing = warning
Microsoft.Negative = warning
# "early-month" and "percent drift" are not the patterns these rules target.
Google.LyHyphens = warning
Microsoft.Percentages = warning
# Pulumi "backend" is a product term.
Microsoft.Avoid = warning
# Identifiers and lowercase CLI and plugin names (finfocus, kubernetes) in
# prose. The vocabulary holds exact product terms only.
Vale.Spelling = warning
Vale.Terms = warning
# House style: spaced em dashes and uncontracted "does not".
Google.EmDash = warning
Microsoft.Dashes = warning

# Every ai-tells rule ships at error level. A formal human style can trip
# them, so each one is lowered to a suggestion. A package bump that adds a
# rule must add it here; `make docs-vale` fails until it does.
ai-tells.AIAdjectiveNounPairs = suggestion
ai-tells.AICompoundPhrases = suggestion
ai-tells.AbsoluteAssertions = suggestion
ai-tells.AbstractionSubject = suggestion
