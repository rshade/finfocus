# Vale prose quality configuration
#
# Run `make docs-vale` locally. CI runs the same config on pull requests
# through vale-action and reviewdog (.github/workflows/docs-validate.yml) and
# reports only the lines a pull request adds.
#
# Google's guide targets end-user product docs. These are docs for a CLI and
# its plugins, so the rules below that misfire on this corpus are turned off,
# each with its reason. That is not a lower bar: a rule stays on wherever it
# finds real problems here.

# `vale sync` downloads the packages into StylesPath. They are git-ignored;
# only config/vocabularies/FinFocus/accept.txt is tracked.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = FinFocus
Packages = Google, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

IgnoredScopes = code, pre

# Don't check these HTML/code elements
IgnoredClasses = pre, code, span

[*.{md,mdx}]
# Google is the base style. Microsoft was dropped: half its hits duplicated a
# Google rule (headings, contractions, acronyms, quotes, dashes, Oxford comma),
# and the rest misfired here ("address" for URL, passive voice, its product
# term list flagging "backend", "spec", and "agent").
BasedOnStyles = Vale, Google, ai-tells

# --- turned off: conflicts with house voice ---

# Headings here are Title Case and mixed across pages; 1467 hits.
Google.Headings = NO

# Falls out of the "**Label**: text" and "Step 1: Do thing" patterns; 853 hits.
Google.Colons = NO

# --- turned off: misfires on developer docs ---

# 299 hits: 210 want "command-line tool" for "CLI" (also "Pulumi CLI") and 88
# want "Google Cloud Platform" for "Cloud" (also "Pulumi Cloud", "Google Cloud").
Google.WordList = NO

# Parentheses carry flag defaults and units in reference docs; 761 hits.
Google.Parens = NO

# Flags CLI, JSON, MCP, and every other acronym a developer reader knows.
Google.Acronyms = NO

# Already off before Vale ran: architecture and reference docs describe what
# the system does, and the passive is often the clear form there.
Google.Passive = NO


# --- lowered to warning: real hits mixed with false ones ---

# Go identifiers in prose (filepath.Match) read as a missing space.
Google.Spacing = warning

# "early-month" is a compound adjective, not an -ly adverb.
Google.LyHyphens = warning

# Fires on lowercase CLI and plugin ids in prose (finfocus, kubernetes). Write
# those in backticks, which Vale skips. The vocabulary holds exact product
# terms only.
Vale.Spelling = warning
Vale.Terms = warning

# Every ai-tells rule ships at error level. A formal human style can trip
# them, so each one is lowered to a suggestion. A package bump that adds or
# drops a rule must update this list; `make docs-vale` fails until it does.
