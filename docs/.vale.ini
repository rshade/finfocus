# Adopted Contributor Covenant text, kept verbatim.
[**/src/content/docs/support/code-of-conduct.md]
BasedOnStyles =

# Generated command pages use the typed command as the title. Vale reads
# front matter as prose and would rename that path to FinFocus. See-also
# paths are code spans, which Vale skips.
[**/src/content/docs/reference/cli/*.md]
Vale.Terms = NO
