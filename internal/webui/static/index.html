<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="finfocus-base" content="">
  <title>FinFocus</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="stylesheet" href="static/zerolog-viewer/viewer.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header">
    <span class="app-title">FinFocus</span>
    <span id="stack-label" class="stack-label" hidden></span>
    <div id="stack-tabs" class="stack-tabs" hidden></div>
    <nav class="app-nav" aria-label="Views">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/cost" data-route="cost">Cost</a>
      <a href="#/anomalies" data-route="anomalies">Anomalies</a>
      <a href="#/recommendations" data-route="recommendations">Recommendations</a>
      <a href="#/estimate" data-route="estimate">Estimate</a>
      <a href="#/forecast" data-route="forecast">Forecast</a>
      <a href="#/carbon" data-route="carbon">Carbon</a>
      <a href="#/plugins" data-route="plugins">Plugins</a>
      <a href="#/config" data-route="config">Config</a>
      <a href="#/logs" data-route="logs" hidden>Logs</a>
    </nav>
    <span id="connection-status" class="connection-status" role="status" aria-live="polite"></span>
  </header>
  <main id="main" tabindex="-1">
    <p id="stack-notice" class="stack-notice" role="status" hidden></p>
    <div id="view" class="view"></div>
  </main>
  <div id="view-announcer" class="visually-hidden" role="alert"></div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
