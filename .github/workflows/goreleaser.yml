name: GoReleaser

# GoReleaser should run when release-please creates a new release.
# Note: release-please creates tags via GitHub API, not git push,
# so we trigger on the release event instead of push to tags.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write # Needed for GoReleaser to upload artifacts to the release

env:
  # Bypass Go proxy for rshade modules - fetch directly from GitHub
  GOPRIVATE: github.com/rshade/*

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'v') }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # 1. Checkout the code at the tag
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      # 2. Setup Go
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      # 3. Resolve the CLI-only tag range so GoReleaser never picks up a
      #    monorepo plugin tag (e.g. kubernetes-v0.1.0) as current/previous.
      - name: Resolve GoReleaser tag range
        id: tags
        run: |
          previous=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$TAG^" 2>/dev/null || true)
          echo "current=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # 4. Run GoReleaser
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tags.outputs.current }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}

      # 5. Re-assert the CLI release as latest. A monorepo plugin release
      #    published moments later can take the flag; this runs after
      #    GoReleaser so a late plugin release cannot leave it stolen.
      - name: Mark CLI release as GitHub latest
        if: ${{ !contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --latest
