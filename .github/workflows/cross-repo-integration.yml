# Installs the published aws-public plugin with `finfocus plugin install` and
# runs core against it, the way users consume it. Nothing is built from the
# plugin source, so gitignored generated data (CCF instance specs) is not needed.

name: Cross-Repository Integration

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'finfocus (core) git ref'
        required: true
        default: 'main'
      plugin_version:
        description: 'aws-public plugin version to install (for example v0.2.4); empty installs the latest release'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

env:
  GO_VERSION: '1.27.3'

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finfocus (core)
        uses: actions/checkout@v7
        with:
          path: core
          ref: ${{ github.event.inputs.core_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Build finfocus (core)
        run: |
          cd core
          make build

      - name: Install aws-public plugin from the registry
        env:
          FINFOCUS_HOME: ${{ github.workspace }}/finfocus-home
          PLUGIN_VERSION: ${{ github.event.inputs.plugin_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SPEC="aws-public"
          if [ -n "${PLUGIN_VERSION}" ]; then
            SPEC="aws-public@${PLUGIN_VERSION}"
          fi
          core/bin/finfocus plugin install "${SPEC}"

      - name: Add core bin to PATH
        run: echo "${{ github.workspace }}/core/bin" >> "$GITHUB_PATH"

      - name: Verify plugin installation (fail-fast)
        env:
          FINFOCUS_HOME: ${{ github.workspace }}/finfocus-home
          PLUGIN_VERSION: ${{ github.event.inputs.plugin_version }}
        run: |
          PLUGIN_ROOT="${FINFOCUS_HOME}/plugins/aws-public"
          BINARY="$(find "${PLUGIN_ROOT}" -type f -name 'finfocus-plugin-aws-public*' -perm -u+x 2>/dev/null | head -n 1)"
          if [ -z "${BINARY}" ]; then
            echo "ERROR: no executable plugin binary under ${PLUGIN_ROOT}"
            find "${FINFOCUS_HOME}" -type f 2>/dev/null || echo "FINFOCUS_HOME does not exist"
            exit 1
          fi
          echo "Plugin binary verified: ${BINARY}"

          LISTING="$(finfocus plugin list)"
          echo "${LISTING}"
          if ! grep -q 'aws-public' <<<"${LISTING}"; then
            echo "ERROR: finfocus plugin list does not show aws-public"
            exit 1
          fi
          if [ -n "${PLUGIN_VERSION}" ] && ! grep -q "${PLUGIN_VERSION}" <<<"${LISTING}"; then
            echo "ERROR: requested version ${PLUGIN_VERSION} not listed"
            exit 1
          fi

      - name: Run integration test (projected cost)
        env:
          FINFOCUS_HOME: ${{ github.workspace }}/finfocus-home
        run: |
          finfocus cost projected --pulumi-json core/testdata/simple-plan.json

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Cross-repo integration failure - ${new Date().toISOString().split('T')[0]}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const coreRef = "${{ github.event.inputs.core_ref || 'nightly' }}";
            const pluginVersion = ${{ toJSON(github.event.inputs.plugin_version || 'latest') }};

            // Check if an issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'integration-failure',
              state: 'open'
            });

            const todayIssue = existingIssues.data.find(issue =>
              issue.title.includes(new Date().toISOString().split('T')[0])
            );

            const body = `## Cross-Repository Integration Failure\n\nThe integration test between finfocus and aws-public plugin has failed.\n\n**Core Ref:** ${coreRef}\n**Plugin Version:** ${pluginVersion}\n**Run URL:** ${runUrl}\n\nPlease investigate and fix the failing integration.`;

            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['integration-failure', 'bug']
              });
            }
