name: Validate Documentation

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-validate.yml'
  pull_request:
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Markdown Files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync documentation
        run: make docs-sync

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --save-dev \
            markdownlint-cli2 \
            prettier \
            markdown-link-check

      - name: Run markdownlint
        run: |
          npx markdownlint-cli2 \
            --config docs/.markdownlint-cli2.jsonc \
            'docs/**/*.md' 'docs/**/*.mdx' \
            '#docs/dist/**' \
            '#docs/node_modules/**' \
            '#docs/.astro/**'
        continue-on-error: true

      - name: Check markdown formatting
        run: |
          npx prettier --check 'docs/**/*.md' 'docs/**/*.mdx' \
            --ignore-path docs/.gitignore
        continue-on-error: true

  link-check:
    runs-on: ubuntu-latest
    name: Check for Broken Links

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync documentation
        run: make docs-sync

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install markdown-link-check
        run: npm install --save-dev markdown-link-check

      - name: Check links in documentation
        run: |
          find docs -type f \( -name "*.md" -o -name "*.mdx" \) ! -path "docs/dist/*" ! -path "docs/node_modules/*" ! -path "docs/.astro/*" | \
          while IFS= read -r file; do
            echo "Checking links in: $file"
            npx markdown-link-check \
              --config docs/.markdown-link-check.json \
              "$file" || true
          done
        continue-on-error: true

  frontmatter:
    runs-on: ubuntu-latest
    name: Validate Frontmatter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync documentation
        run: make docs-sync

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate YAML frontmatter
        run: |
          errors=0
          while IFS= read -r file; do
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "✗ $file: missing opening --- fence"
              errors=$((errors + 1))
              continue
            fi
            fm=$(awk 'NR==1{next} /^---$/{exit} {print}' "$file")
            if ! awk 'NR==1{next} /^---$/{found=1; exit} END{exit !found}' "$file"; then
              echo "✗ $file: missing closing --- fence"
              errors=$((errors + 1))
              continue
            fi
            if ! echo "$fm" | grep -q "^title:"; then
              echo "✗ $file: missing required 'title' field"
              errors=$((errors + 1))
            else
              echo "✓ $file"
            fi
            if ! echo "$fm" | grep -q "^description:"; then
              echo "  ⚠ $file: missing recommended 'description' field"
            fi
          done < <(find docs/src/content/docs -type f \( -name "*.md" -o -name "*.mdx" \) | sort)
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors frontmatter errors found"
            exit 1
          fi
          echo "✓ All frontmatter validated"

  structure:
    runs-on: ubuntu-latest
    name: Validate Documentation Structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync documentation
        run: make docs-sync

      - name: Check for required files
        run: |
          required_files=(
            "docs/src/content/docs/README.md"
            "docs/src/content/docs/plan.md"
            "docs/src/content/docs/llms.txt"
            "docs/package.json"
            "docs/astro.config.mjs"
            "docs/.markdownlint-cli2.jsonc"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ Missing: $file"
              missing=$((missing + 1))
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "❌ $missing required files missing"
            exit 1
          fi
          echo "✓ All required documentation files present"

      - name: Validate directory structure
        run: |
          required_dirs=(
            "docs/src/content/docs/guides"
            "docs/src/content/docs/getting-started"
            "docs/src/content/docs/architecture"
            "docs/src/content/docs/plugins"
            "docs/src/content/docs/reference"
            "docs/src/content/docs/deployment"
            "docs/src/content/docs/support"
            "docs/src/content/docs/commands"
            "docs/src/content/docs/examples"
            "docs/src/content/docs/schemas"
            "docs/src/content/docs/testing"
          )

          missing=0
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✓ $dir/"
            else
              echo "✗ Missing: $dir/"
              missing=$((missing + 1))
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "❌ $missing required directories missing"
            exit 1
          fi
          echo "✓ Documentation directory structure validated"

  llms-txt:
    runs-on: ubuntu-latest
    name: Validate llms.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync documentation
        run: make docs-sync

      - name: Check llms.txt exists and is updated
        run: |
          if [ ! -f "docs/src/content/docs/llms.txt" ]; then
            echo "❌ docs/src/content/docs/llms.txt not found"
            exit 1
          fi

          # Check that llms.txt has recent update timestamp
          if grep -q "Last Updated:" docs/src/content/docs/llms.txt; then
            echo "✓ llms.txt has update timestamp"
          else
            echo "⚠ llms.txt missing update timestamp"
          fi

          # Check that llms.txt references main documentation
          required_sections=(
            "Quick Navigation"
            "Complete Documentation Map"
            "Key Concepts"
          )

          for section in "${required_sections[@]}"; do
            if grep -q "$section" docs/src/content/docs/llms.txt; then
              echo "✓ Found section: $section"
            else
              echo "⚠ Missing section: $section"
            fi
          done

  validation-summary:
    runs-on: ubuntu-latest
    name: Documentation Validation Summary
    if: always()
    needs: [lint, link-check, frontmatter, structure, llms-txt]

    steps:
      - name: Check results
        run: |
          {
            echo "## Documentation Validation Summary"
            echo ""

            echo "- Markdown Linting: ${{ needs.lint.result }}"
            echo "- Link Checking: ${{ needs.link-check.result }}"
            echo "- Frontmatter Validation: ${{ needs.frontmatter.result }}"
            echo "- Structure Validation: ${{ needs.structure.result }}"
            echo "- llms.txt Validation: ${{ needs.llms-txt.result }}"

            if [ "${{ needs.structure.result }}" != "success" ]; then
              echo ""
              echo "⚠️ **Note:** Some validation checks failed, but this is expected during development."
              echo "Please review the logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
