name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  GO_VERSION: '1.25.8'
  # Bypass Go proxy for rshade modules - fetch directly from GitHub
  GOPRIVATE: github.com/rshade/*

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build plugin binaries for integration tests
        run: |
          # Build example plugin binaries that may be used by tests
          if [ -d "examples/plugins/aws-example" ]; then
            go build -o bin/aws-example-plugin ./examples/plugins/aws-example
          fi
          # Build recorder plugin for integration tests
          make build-recorder

      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/...
          go tool cover -func=coverage.out

      - name: Run integration tests
        run: |
          go test -v -race ./test/integration/...

      - name: Check overall coverage threshold
        run: |
          chmod +x scripts/check-coverage.sh
          scripts/check-coverage.sh coverage.out 60

      - name: Check critical path coverage
        run: |
          chmod +x scripts/check-critical-coverage.sh
          scripts/check-critical-coverage.sh coverage.out 60

      - name: Generate Cobertura coverage report
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
          verbose: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m

      - name: Run markdownlint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes markdownlint-cli@0.45.0 AGENTS.md

      - name: Run ShellCheck
        run: shellcheck scripts/install.sh

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ "$(git diff --name-only)" ]; then
            echo "go mod tidy resulted in changes"
            git diff
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify go.mod sync between root and e2e modules
        run: |
          ROOT_GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          E2E_GO_VERSION=$(grep '^go ' test/e2e/go.mod | awk '{print $2}')
          if [ "$ROOT_GO_VERSION" != "$E2E_GO_VERSION" ]; then
            echo "ERROR: Go version mismatch: root=$ROOT_GO_VERSION e2e=$E2E_GO_VERSION"
            exit 1
          fi
          echo "Go version sync OK: $ROOT_GO_VERSION"

          # Compare shared dependency versions
          SYNC_FAILED=0
          for DEP in "github.com/rshade/finfocus-spec" "github.com/stretchr/testify"; do
            ROOT_VER=$(grep "	${DEP} " go.mod | awk '{print $2}' || true)
            E2E_VER=$(grep "	${DEP} " test/e2e/go.mod | awk '{print $2}' || true)
            if [ -n "$ROOT_VER" ] && [ -n "$E2E_VER" ] && [ "$ROOT_VER" != "$E2E_VER" ]; then
              echo "WARNING: ${DEP} version mismatch: root=$ROOT_VER e2e=$E2E_VER"
              SYNC_FAILED=1
            elif [ -n "$ROOT_VER" ] && [ -n "$E2E_VER" ]; then
              echo "${DEP} sync OK: $ROOT_VER"
            fi
          done
          if [ "$SYNC_FAILED" -eq 1 ]; then
            echo "ERROR: Shared dependency versions are out of sync"
            exit 1
          fi

  fuzz:
    name: Fuzz Testing (Smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Restore fuzz corpus cache
        uses: actions/cache@v5
        with:
          path: |
            internal/ingest/testdata/fuzz
            internal/spec/testdata/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Run JSON fuzz test (30s smoke)
        run: |
          # Use -timeout=90s to give adequate cleanup headroom beyond the 30s fuzz duration
          # Fuzzing framework needs extra time for corpus cache writes, especially with many new inputs
          go test -fuzz=FuzzJSON -fuzztime=30s -timeout=90s ./internal/ingest
          go test -fuzz=FuzzPulumiPlanParse -fuzztime=30s -timeout=90s ./internal/ingest

      - name: Run YAML fuzz test (30s smoke)
        run: |
          # Use -timeout=90s to give adequate cleanup headroom beyond the 30s fuzz duration
          # Fuzzing framework needs extra time for corpus cache writes, especially with many new inputs
          go test -fuzz=FuzzYAML -fuzztime=30s -timeout=90s ./internal/spec
          go test -fuzz=FuzzSpecFilename -fuzztime=30s -timeout=90s ./internal/spec

      - name: Save fuzz corpus cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            internal/ingest/testdata/fuzz
            internal/spec/testdata/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}

  benchmark-baseline:
    name: Benchmark Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        env:
          FINFOCUS_LOG_LEVEL: error
        run: |
          set -eo pipefail
          go test -bench=Benchmark -skip='100K' -benchtime=1x -count=5 -benchmem \
            ./test/benchmarks/... 2>&1 | \
            ./scripts/ci-benchmark-filter.sh > test/benchmarks/baseline.txt

      - name: Save baseline cache
        uses: actions/cache/save@v5
        with:
          path: test/benchmarks/baseline.txt
          key: benchmark-baseline-${{ runner.os }}-go${{ env.GO_VERSION }}

  benchmark-compare:
    name: Benchmark Compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Restore baseline cache
        id: baseline
        uses: actions/cache/restore@v5
        with:
          path: test/benchmarks/baseline.txt
          key: benchmark-baseline-${{ runner.os }}-go${{ env.GO_VERSION }}

      - name: Run benchmarks
        env:
          FINFOCUS_LOG_LEVEL: error
        run: |
          set -eo pipefail
          go test -bench=Benchmark -skip='100K' -benchtime=1x -count=5 -benchmem \
            ./test/benchmarks/... 2>&1 | \
            ./scripts/ci-benchmark-filter.sh > test/benchmarks/current.txt

      - name: Compare with benchstat
        id: compare
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          benchstat test/benchmarks/baseline.txt test/benchmarks/current.txt \
            > test/benchmarks/comparison.txt 2>&1 || true

          # Parse regression severities from benchstat output
          # Only positive deltas indicate regressions; negative deltas are improvements
          REGRESSION_LEVEL="none"
          ERROR_COUNT=0
          WARNING_COUNT=0
          IMPROVED_COUNT=0

          while IFS= read -r line; do
            if echo "$line" | grep -qE '[+-][0-9]+(\.[0-9]+)?%'; then
              pct=$(echo "$line" | grep -oE '[+-][0-9]+(\.[0-9]+)?%' | head -1 | tr -d '%')
              is_error=$(echo "$pct" | awk '{if ($1 > 50.0) print "yes"; else print "no"}')
              is_warning=$(echo "$pct" | awk '{if ($1 > 20.0 && $1 <= 50.0) print "yes"; else print "no"}')
              is_improved=$(echo "$pct" | awk '{if ($1 < -20.0) print "yes"; else print "no"}')

              if [ "$is_error" = "yes" ]; then
                ERROR_COUNT=$((ERROR_COUNT + 1))
                REGRESSION_LEVEL="error"
              elif [ "$is_warning" = "yes" ]; then
                WARNING_COUNT=$((WARNING_COUNT + 1))
                if [ "$REGRESSION_LEVEL" != "error" ]; then
                  REGRESSION_LEVEL="warning"
                fi
              elif [ "$is_improved" = "yes" ]; then
                IMPROVED_COUNT=$((IMPROVED_COUNT + 1))
                if [ "$REGRESSION_LEVEL" = "none" ]; then
                  REGRESSION_LEVEL="improved"
                fi
              fi
            fi
          done < test/benchmarks/comparison.txt

          {
            echo "REGRESSION_LEVEL=$REGRESSION_LEVEL"
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "IMPROVED_COUNT=$IMPROVED_COUNT"
          } >> "$GITHUB_ENV"

          {
            echo "COMPARISON_BODY<<BENCHEOF"
            cat test/benchmarks/comparison.txt
            echo "BENCHEOF"
          } >> "$GITHUB_ENV"

      - name: Post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            if (!context.issue || !context.issue.number) {
              console.log('No PR number available, skipping benchmark comment');
              return;
            }

            const fs = require('fs');

            let currentResults = '';
            try {
              currentResults = fs.readFileSync('test/benchmarks/current.txt', 'utf8');
            } catch (e) {
              currentResults = 'Unable to read benchmark results';
            }

            const baselineHit = '${{ steps.baseline.outputs.cache-hit }}' === 'true';
            const regressionLevel = process.env.REGRESSION_LEVEL || 'none';
            const errorCount = parseInt(process.env.ERROR_COUNT || '0');
            const warningCount = parseInt(process.env.WARNING_COUNT || '0');
            const improvedCount = parseInt(process.env.IMPROVED_COUNT || '0');
            const comparisonBody = process.env.COMPARISON_BODY || '';

            let body = '<!-- benchmark-results -->\n## Benchmark Results\n\n';

            if (!baselineHit) {
              body += '> **Note**: No baseline available yet. Benchmark results will be compared once the main branch baseline is generated.\n\n';
              body += '<details>\n<summary>Current benchmark results</summary>\n\n';
              body += '```\n' + currentResults + '\n```\n\n</details>\n';
            } else {
              // Severity summary
              if (regressionLevel === 'error') {
                body += `> :rotating_light: **${errorCount} benchmark(s) showed >50% regression**\n`;
                if (warningCount > 0) body += `> :warning: **${warningCount} benchmark(s) showed >20% regression**\n`;
                if (improvedCount > 0) body += `> :arrow_down: **${improvedCount} benchmark(s) improved**\n`;
              } else if (regressionLevel === 'warning') {
                body += `> :warning: **${warningCount} benchmark(s) showed >20% regression**\n`;
                if (improvedCount > 0) body += `> :arrow_down: **${improvedCount} benchmark(s) improved**\n`;
              } else if (regressionLevel === 'improved') {
                body += `> :arrow_down: **${improvedCount} benchmark(s) improved**\n`;
              } else {
                body += '> :white_check_mark: All benchmarks within expected range\n';
              }

              body += '\n```\n' + comparisonBody + '\n```\n\n';

              body += '<details>\n<summary>Full benchmark output</summary>\n\n';
              body += '```\n' + currentResults + '\n```\n\n</details>\n';
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.body.includes('<!-- benchmark-results -->')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-ldflags \"-X 'github.com/rshade/finfocus/pkg/version.version=${VERSION}' -X 'github.com/rshade/finfocus/pkg/version.gitCommit=${COMMIT}' -X 'github.com/rshade/finfocus/pkg/version.buildDate=${BUILD_DATE}'\""

          BINARY_NAME="finfocus"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          mkdir -p dist
          eval go build "${LDFLAGS}" -o "dist/${BINARY_NAME}-${GOOS}-${GOARCH}" ./cmd/finfocus

          # Build recorder plugin
          RECORDER_NAME="finfocus-plugin-recorder"
          if [ "${GOOS}" = "windows" ]; then
            RECORDER_NAME="${RECORDER_NAME}.exe"
          fi
          eval go build "${LDFLAGS}" -o "dist/${RECORDER_NAME}-${GOOS}-${GOARCH}" ./plugins/recorder/cmd

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: finfocus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/finfocus*
