# Test configuration for analyzer threshold enforcement
# Used by integration tests to verify threshold configuration loading

output:
  default_format: "table"
  precision: 2

logging:
  level: "info"
  format: "text"

analyzer:
  max_monthly_cost: 5000.00
  enforcement: mandatory
  timeout:
    per_resource: "5s"
    total: "60s"
    warn_threshold: "30s"
